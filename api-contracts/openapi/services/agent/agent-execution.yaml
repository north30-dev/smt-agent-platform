openapi: 3.0.3
info:
  title: SMT 执行智能体 REST API
  description: |
    agent-execution 执行智能体接口契约。覆盖指令创建/审批/进度上报、异常记录/分析/处置/验证闭环。
    外部路径前缀 /api/agent/v1/execution/** 经 smt-gateway StripPrefix=2 路由到 agent-execution (8006)。
    响应体业务对象直返，字段 snake_case。
  version: 1.0.0
  contact:
    name: smt-agent-platform
    url: https://github.com/north30/smt-agent-platform
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080
    description: 本地开发环境（经 smt-gateway 网关）
tags:
  - name: 执行智能体
    description: agent-execution 执行智能体相关接口
paths:
  /api/agent/v1/execution/instructions:
    post:
      tags:
        - 执行智能体
      summary: 创建执行指令
      description: |
        创建一条处置指令。支持两种模式：
        - 自动生成模式：传入 source_workflow_id + diagnosis + schedule_adjustment，
          由 execution Agent 基于"人/机/料/法/环"分析自动生成指令类型、载荷与优先级。
        - 手动模式：直接传入 type + payload + priority。
        创建后指令状态默认为 PENDING；高优先级（CRITICAL）且不可自动执行的指令进入 PENDING_APPROVAL。
      operationId: createExecutionInstruction
      requestBody:
        required: true
        description: 指令创建请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionInstructionCreateRequest'
            examples:
              autoGenerate:
                summary: 自动生成模式
                value:
                  source_workflow_id: wf-2026-0001
                  diagnosis:
                    root_causes:
                      - X 轴导轨润滑不足
                    repair_suggestions:
                      - 立即补充 X 轴导轨润滑油
                  schedule_adjustment:
                    estimated_delay_hours: 2.0
              manual:
                summary: 手动模式
                value:
                  type: REPAIR
                  payload:
                    device_id: 1001
                    action: 补充导轨润滑油
                  priority: CRITICAL
      responses:
        '200':
          description: 创建成功（自动生成模式可能返回多条指令）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionInstructionCreateResponse'
              examples:
                success:
                  summary: 创建成功（自动生成模式，返回指令列表）
                  value:
                    instructions:
                      - instruction_id: ins-2026-0001
                        type: REPAIR
                        status: PENDING_APPROVAL
                        priority: CRITICAL
                        payload:
                          device_id: 1001
                          action: 补充导轨润滑油
                        auto_execute: false
                        source_workflow_id: wf-2026-0001
                        created_at: '2026-07-09T08:30:00Z'
                        updated_at: '2026-07-09T08:30:00Z'
        '400':
          description: 参数错误（两种模式必填字段均缺失）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  summary: 必填字段缺失
                  value:
                    error: MISSING_INSTRUCTION_REQUIRED_FIELDS
                    message: 自动生成模式需 source_workflow_id，手动模式需 type/payload/priority
    get:
      tags:
        - 执行智能体
      summary: 查询执行指令列表
      description: 分页查询执行指令列表，支持按状态与类型筛选，按创建时间倒序。
      operationId: listExecutionInstructions
      parameters:
        - name: page
          in: query
          description: 页码（从 1 开始）
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: size
          in: query
          description: 每页大小
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
            example: 20
        - name: status
          in: query
          description: 指令状态筛选
          required: false
          schema:
            $ref: '#/components/schemas/InstructionStatus'
        - name: instruction_type
          in: query
          description: 指令类型筛选
          required: false
          schema:
            $ref: '#/components/schemas/InstructionType'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionInstructionListResponse'
              examples:
                page:
                  summary: 指令分页示例
                  value:
                    records:
                      - instruction_id: ins-2026-0001
                        type: REPAIR
                        status: PENDING_APPROVAL
                        priority: CRITICAL
                        payload:
                          device_id: 1001
                          action: 补充导轨润滑油
                        auto_execute: false
                        source_workflow_id: wf-2026-0001
                        created_at: '2026-07-09T08:30:00Z'
                    total: 1
                    page: 1
                    size: 20
        '400':
          description: 参数错误（page/size 不合法）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPage:
                  summary: 分页参数不合法
                  value:
                    error: INVALID_PAGINATION
                    message: page 须 ≥1，size 须在 1-100 之间
  /api/agent/v1/execution/instructions/{instruction_id}:
    get:
      tags:
        - 执行智能体
      summary: 查询单条执行指令
      description: 根据指令 ID 查询单条指令详情。
      operationId: getExecutionInstruction
      parameters:
        - $ref: '../../shared/components.yaml#/components/parameters/InstructionIdPathParam'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionInstructionResponse'
              examples:
                instruction:
                  summary: 指令详情示例
                  value:
                    instruction_id: ins-2026-0001
                    type: REPAIR
                    status: PENDING_APPROVAL
                    priority: CRITICAL
                    payload:
                      device_id: 1001
                      action: 补充导轨润滑油
                    auto_execute: false
                    source_workflow_id: wf-2026-0001
                    created_at: '2026-07-09T08:30:00Z'
        '404':
          description: 指令不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: 指令不存在
                  value:
                    error: INSTRUCTION_NOT_FOUND
                    message: 指令 ID 不存在
  /api/agent/v1/execution/instructions/{instruction_id}/approve:
    post:
      tags:
        - 执行智能体
      summary: 审批执行指令
      description: |
        对待审批指令（PENDING_APPROVAL）进行审批通过或驳回。
        审批通过后状态转为 APPROVED，可进入执行；驳回后状态转为 REJECTED。
      operationId: approveExecutionInstruction
      parameters:
        - $ref: '../../shared/components.yaml#/components/parameters/InstructionIdPathParam'
      requestBody:
        required: true
        description: 审批请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionApproveRequest'
            examples:
              approve:
                summary: 审批通过
                value:
                  decision: approve
                  approver: zhang_san
                  comment: 同意执行维修
              reject:
                summary: 审批驳回
                value:
                  decision: reject
                  approver: li_si
                  comment: 需进一步评估影响
      responses:
        '200':
          description: 审批完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionInstructionResponse'
              examples:
                approved:
                  summary: 审批通过
                  value:
                    instruction_id: ins-2026-0001
                    type: REPAIR
                    status: APPROVED
                    priority: CRITICAL
                    payload:
                      device_id: 1001
                      action: 补充导轨润滑油
                    auto_execute: false
                    source_workflow_id: wf-2026-0001
                    approved_by: zhang_san
                    approved_at: '2026-07-09T09:00:00Z'
                    created_at: '2026-07-09T08:30:00Z'
        '404':
          description: 指令不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: 指令不存在
                  value:
                    error: INSTRUCTION_NOT_FOUND
                    message: 指令 ID 不存在
        '409':
          description: 指令状态不允许审批（非 PENDING_APPROVAL）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                illegalState:
                  summary: 状态非法
                  value:
                    error: ILLEGAL_STATE_TRANSITION
                    message: 指令当前状态不允许审批
  /api/agent/v1/execution/instructions/{instruction_id}/progress:
    post:
      tags:
        - 执行智能体
      summary: 上报执行进度
      description: |
        上报指令执行进度。APPROVED 状态的指令可转为 EXECUTING；
        EXECUTING 状态的指令可转为 COMPLETED 或 FAILED。非法状态转换返回 409。
      operationId: reportExecutionProgress
      parameters:
        - $ref: '../../shared/components.yaml#/components/parameters/InstructionIdPathParam'
      requestBody:
        required: true
        description: 进度上报请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionProgressRequest'
            examples:
              executing:
                summary: 开始执行
                value:
                  status: EXECUTING
                  note: 维修人员已到场
              completed:
                summary: 执行完成
                value:
                  status: COMPLETED
                  note: 已补充润滑油并复测正常
      responses:
        '200':
          description: 进度上报成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionInstructionResponse'
              examples:
                completed:
                  summary: 执行完成
                  value:
                    instruction_id: ins-2026-0001
                    type: REPAIR
                    status: COMPLETED
                    priority: CRITICAL
                    payload:
                      device_id: 1001
                      action: 补充导轨润滑油
                    auto_execute: false
                    source_workflow_id: wf-2026-0001
                    completed_at: '2026-07-09T10:00:00Z'
                    created_at: '2026-07-09T08:30:00Z'
        '404':
          description: 指令不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: 指令不存在
                  value:
                    error: INSTRUCTION_NOT_FOUND
                    message: 指令 ID 不存在
        '409':
          description: 非法状态转换（如从 PENDING 直接转为 EXECUTING）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                illegalTransition:
                  summary: 状态转换非法
                  value:
                    error: ILLEGAL_STATE_TRANSITION
                    message: 当前状态不允许转换到 EXECUTING
  /api/agent/v1/execution/exceptions:
    post:
      tags:
        - 执行智能体
      summary: 创建异常记录
      description: |
        创建一条异常记录，用于追踪指令执行过程中产生的异常（如执行失败、超时、二次故障等）。
        创建后异常状态默认为 OPEN，等待分析后转为 ANALYZED，处置后转为 HANDLED，验证通过后转为 CLOSED。
      operationId: createExecutionException
      requestBody:
        required: true
        description: 异常创建请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionCreateRequest'
            examples:
              exception:
                summary: 异常创建示例
                value:
                  source: instruction_failed
                  instruction_id: ins-2026-0001
                  description: 维修人员反馈润滑油型号不匹配，无法执行
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
              examples:
                success:
                  summary: 创建成功
                  value:
                    exception_id: exc-2026-0001
                    source: instruction_failed
                    instruction_id: ins-2026-0001
                    description: 维修人员反馈润滑油型号不匹配，无法执行
                    status: OPEN
                    created_at: '2026-07-09T10:30:00Z'
        '400':
          description: 参数错误（source 或 description 为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  summary: 必填字段缺失
                  value:
                    error: MISSING_EXCEPTION_REQUIRED_FIELDS
                    message: 异常来源与描述均为必填
    get:
      tags:
        - 执行智能体
      summary: 查询异常记录列表
      description: 分页查询异常记录列表，支持按状态筛选，按创建时间倒序。
      operationId: listExecutionExceptions
      parameters:
        - name: page
          in: query
          description: 页码（从 1 开始）
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: size
          in: query
          description: 每页大小
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
            example: 20
        - name: status
          in: query
          description: 异常状态筛选
          required: false
          schema:
            $ref: '#/components/schemas/ExceptionStatus'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionListResponse'
              examples:
                page:
                  summary: 异常分页示例
                  value:
                    records:
                      - exception_id: exc-2026-0001
                        source: instruction_failed
                        instruction_id: ins-2026-0001
                        description: 维修人员反馈润滑油型号不匹配，无法执行
                        status: OPEN
                        created_at: '2026-07-09T10:30:00Z'
                    total: 1
                    page: 1
                    size: 20
        '400':
          description: 参数错误（page/size 不合法）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPage:
                  summary: 分页参数不合法
                  value:
                    error: INVALID_PAGINATION
                    message: page 须 ≥1，size 须在 1-100 之间
  /api/agent/v1/execution/exceptions/{exception_id}/verify:
    post:
      tags:
        - 执行智能体
      summary: 验证异常闭环
      description: |
        对 HANDLED 状态的异常进行闭环验证。验证通过则状态转为 CLOSED，验证不通过则回退为 OPEN 等待重新处置。
      operationId: verifyExecutionException
      parameters:
        - $ref: '../../shared/components.yaml#/components/parameters/ExceptionIdPathParam'
      requestBody:
        required: true
        description: 验证请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExceptionVerifyRequest'
            examples:
              pass:
                summary: 验证通过
                value:
                  passed: true
                  note: 已更换正确型号润滑油并复测正常
              fail:
                summary: 验证不通过
                value:
                  passed: false
                  note: 振动指标仍偏高，需进一步排查
      responses:
        '200':
          description: 验证完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionVerifyResponse'
              examples:
                closed:
                  summary: 验证通过，异常关闭
                  value:
                    exception_id: exc-2026-0001
                    status: CLOSED
                    note: 已更换正确型号润滑油并复测正常
                reopened:
                  summary: 验证不通过，异常重新打开
                  value:
                    exception_id: exc-2026-0001
                    status: OPEN
                    note: 振动指标仍偏高，需进一步排查
        '404':
          description: 异常不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: 异常不存在
                  value:
                    error: EXCEPTION_NOT_FOUND
                    message: 异常 ID 不存在
  /api/agent/v1/execution/exceptions/{exception_id}/analyze:
    post:
      tags:
        - 执行智能体
      summary: LLM 根因分析异常
      description: |
        对异常记录进行 LLM 根因分析，状态从 OPEN 推进为 ANALYZED。
        LLM 不可达时降级为手动审查标记，不阻断流程。
      operationId: analyzeExecutionException
      parameters:
        - $ref: '../../shared/components.yaml#/components/parameters/ExceptionIdPathParam'
      responses:
        '200':
          description: 分析完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
              examples:
                analyzed:
                  summary: 分析完成
                  value:
                    exception_id: exc-2026-0001
                    source: instruction_failed
                    instruction_id: ins-2026-0001
                    description: 维修人员反馈润滑油型号不匹配，无法执行
                    status: ANALYZED
                    analysis:
                      root_cause: 润滑油型号不匹配
                      suggestion: 更换正确型号润滑油
                    created_at: '2026-07-09T10:30:00Z'
                    updated_at: '2026-07-09T10:35:00Z'
        '404':
          description: 异常不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: 异常不存在
                  value:
                    error: EXCEPTION_NOT_FOUND
                    message: 异常 ID 不存在
  /api/agent/v1/execution/exceptions/{exception_id}/handle:
    post:
      tags:
        - 执行智能体
      summary: 推进异常状态为 HANDLED
      description: 将 ANALYZED 状态的异常推进为 HANDLED，表示已处置完毕等待验证。
      operationId: handleExecutionException
      parameters:
        - $ref: '../../shared/components.yaml#/components/parameters/ExceptionIdPathParam'
      responses:
        '200':
          description: 处置完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
              examples:
                handled:
                  summary: 处置完成
                  value:
                    exception_id: exc-2026-0001
                    source: instruction_failed
                    instruction_id: ins-2026-0001
                    description: 维修人员反馈润滑油型号不匹配，无法执行
                    status: HANDLED
                    created_at: '2026-07-09T10:30:00Z'
                    updated_at: '2026-07-09T11:00:00Z'
        '400':
          description: 状态不允许处置（非 ANALYZED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                illegalState:
                  summary: 状态非法
                  value:
                    error: ILLEGAL_STATE_TRANSITION
                    message: 异常当前状态不允许处置
components:
  schemas:
    ErrorResponse:
      type: object
      description: 错误响应
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 错误码
          example: INSTRUCTION_NOT_FOUND
        message:
          type: string
          description: 错误信息
          example: 指令 ID 不存在
    InstructionType:
      type: string
      description: 指令类型
      enum:
        - REPAIR
        - PRODUCTION_ADJUST
        - PARAM_CHANGE
      example: REPAIR
    InstructionStatus:
      type: string
      description: 指令状态
      enum:
        - PENDING
        - PENDING_APPROVAL
        - APPROVED
        - REJECTED
        - EXECUTING
        - COMPLETED
        - FAILED
      example: PENDING
    InstructionPriority:
      type: string
      description: 指令优先级
      enum:
        - LOW
        - MEDIUM
        - CRITICAL
      example: CRITICAL
    ExceptionStatus:
      type: string
      description: 异常状态
      enum:
        - OPEN
        - ANALYZED
        - HANDLED
        - CLOSED
      example: OPEN
    ExecutionInstructionCreateRequest:
      type: object
      description: |
        指令创建请求体，支持两种模式：
        - 自动生成模式：传入 source_workflow_id + diagnosis + schedule_adjustment，
          由 execution Agent 基于"人/机/料/法/环"分析自动生成指令类型、载荷与优先级。
        - 手动模式：直接传入 type + payload + priority。
      properties:
        source_workflow_id:
          type: string
          description: 来源工作流 ID（自动生成模式必填）
          nullable: true
          example: wf-2026-0001
        diagnosis:
          type: object
          description: 诊断结果（自动生成模式传入，来自 maintenance/quality Agent）
          nullable: true
          additionalProperties: true
        schedule_adjustment:
          type: object
          description: 排产调整方案（自动生成模式传入，来自 scheduler Agent）
          nullable: true
          additionalProperties: true
        type:
          $ref: '#/components/schemas/InstructionType'
        payload:
          type: object
          description: 指令载荷（手动模式必填，具体结构由 type 决定）
          nullable: true
          additionalProperties: true
        priority:
          $ref: '#/components/schemas/InstructionPriority'
    ExecutionInstructionCreateResponse:
      type: object
      description: 创建执行指令响应（自动生成模式可能返回多条指令）
      required:
        - instructions
      properties:
        instructions:
          type: array
          description: 创建的指令列表
          items:
            $ref: '#/components/schemas/ExecutionInstructionResponse'
    ExecutionInstructionResponse:
      type: object
      description: 执行指令响应
      required:
        - instruction_id
        - type
        - payload
        - status
        - priority
        - auto_execute
        - created_at
        - updated_at
      properties:
        instruction_id:
          type: string
          description: 指令 ID
          example: ins-2026-0001
        source_workflow_id:
          type: string
          description: 来源工作流 ID（手动创建时为 null）
          nullable: true
          example: wf-2026-0001
        type:
          $ref: '#/components/schemas/InstructionType'
        payload:
          type: object
          description: 指令载荷（具体结构由 type 决定）
          additionalProperties: true
        status:
          $ref: '#/components/schemas/InstructionStatus'
        priority:
          $ref: '#/components/schemas/InstructionPriority'
        auto_execute:
          type: boolean
          description: 是否可自动执行（不可自动执行的指令必须人工审批）
          example: false
        approved_by:
          type: string
          description: 审批人（未审批时为 null）
          nullable: true
          example: zhang_san
        approved_at:
          type: string
          format: date-time
          description: 审批时间（ISO-8601，未审批时为 null）
          nullable: true
          example: '2026-07-09T09:00:00Z'
        completed_at:
          type: string
          format: date-time
          description: 完成时间（ISO-8601，未完成时为 null）
          nullable: true
          example: '2026-07-09T10:00:00Z'
        created_at:
          type: string
          format: date-time
          description: 创建时间（ISO-8601）
          example: '2026-07-09T08:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间（ISO-8601）
          example: '2026-07-09T08:30:00Z'
    ExecutionInstructionListResponse:
      type: object
      description: 执行指令分页响应
      required:
        - records
        - total
        - page
        - size
      properties:
        records:
          type: array
          description: 指令列表（按创建时间倒序）
          items:
            $ref: '#/components/schemas/ExecutionInstructionResponse'
        total:
          type: integer
          description: 总记录数
          example: 1
        page:
          type: integer
          description: 当前页码
          example: 1
        size:
          type: integer
          description: 每页大小
          example: 20
    ExecutionApproveRequest:
      type: object
      description: 指令审批请求体
      required:
        - decision
        - approver
      properties:
        decision:
          type: string
          description: 审批决定
          enum:
            - approve
            - reject
          example: approve
        approver:
          type: string
          description: 审批人
          example: zhang_san
        comment:
          type: string
          description: 审批意见
          nullable: true
          example: 同意执行维修
    ExecutionProgressRequest:
      type: object
      description: 指令进度上报请求体
      required:
        - status
      properties:
        status:
          type: string
          description: 目标状态（仅允许 EXECUTING/COMPLETED/FAILED）
          enum:
            - EXECUTING
            - COMPLETED
            - FAILED
          example: COMPLETED
        note:
          type: string
          description: 进度备注
          nullable: true
          example: 已补充润滑油并复测正常
    ExceptionCreateRequest:
      type: object
      description: 异常记录创建请求体
      required:
        - source
        - description
      properties:
        source:
          type: string
          description: 异常来源（如 instruction_failed、device_alert、manual_report）
          example: instruction_failed
        instruction_id:
          type: string
          description: 关联指令 ID（指令执行产生的异常时填写）
          nullable: true
          example: ins-2026-0001
        description:
          type: string
          description: 异常描述
          example: 维修人员反馈润滑油型号不匹配，无法执行
    ExceptionResponse:
      type: object
      description: 异常记录响应
      required:
        - exception_id
        - source
        - description
        - status
        - created_at
      properties:
        exception_id:
          type: string
          description: 异常 ID
          example: exc-2026-0001
        source:
          type: string
          description: 异常来源
          example: instruction_failed
        instruction_id:
          type: string
          description: 关联指令 ID（无关联时为 null）
          nullable: true
          example: ins-2026-0001
        description:
          type: string
          description: 异常描述
          example: 维修人员反馈润滑油型号不匹配，无法执行
        status:
          $ref: '#/components/schemas/ExceptionStatus'
        analysis:
          type: object
          description: LLM 根因分析结果（未分析时为 null）
          nullable: true
          properties:
            root_cause:
              type: string
              description: 根因
              example: 润滑油型号不匹配
            suggestion:
              type: string
              description: 建议
              example: 更换正确型号润滑油
        created_at:
          type: string
          format: date-time
          description: 创建时间（ISO-8601）
          example: '2026-07-09T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: 更新时间（ISO-8601，未更新时为 null）
          nullable: true
          example: '2026-07-09T10:35:00Z'
        closed_at:
          type: string
          format: date-time
          description: 关闭时间（ISO-8601，未关闭时为 null）
          nullable: true
          example: '2026-07-09T11:00:00Z'
    ExceptionListResponse:
      type: object
      description: 异常记录分页响应
      required:
        - records
        - total
        - page
        - size
      properties:
        records:
          type: array
          description: 异常记录列表（按创建时间倒序）
          items:
            $ref: '#/components/schemas/ExceptionResponse'
        total:
          type: integer
          description: 总记录数
          example: 1
        page:
          type: integer
          description: 当前页码
          example: 1
        size:
          type: integer
          description: 每页大小
          example: 20
    ExceptionVerifyRequest:
      type: object
      description: 异常验证请求体
      required:
        - passed
      properties:
        passed:
          type: boolean
          description: 验证是否通过
          example: true
        note:
          type: string
          description: 验证备注
          nullable: true
          example: 已更换正确型号润滑油并复测正常
    ExceptionVerifyResponse:
      type: object
      description: 异常验证响应
      required:
        - exception_id
        - status
      properties:
        exception_id:
          type: string
          description: 异常 ID
          example: exc-2026-0001
        status:
          $ref: '#/components/schemas/ExceptionStatus'
        note:
          type: string
          description: 验证备注
          nullable: true
          example: 已更换正确型号润滑油并复测正常
