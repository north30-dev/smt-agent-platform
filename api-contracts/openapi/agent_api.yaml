            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerOrderListResponse'
              examples:
                list:
                  summary: 订单列表示例
                  value:
                    records:
                      - order_id: 1
                        order_no: ORD-2026-0001
                        product_model: PCBA-A
                        quantity: 5000
                        priority: NORMAL
                        delivery_date: '2026-07-15'
                        material_ready: true
                        status: PENDING
                        created_at: '2026-07-06T08:30:00Z'
                    total: 1
  /api/agent/scheduler/plan/generate:
    post:
      tags:
        - 调度智能体
      summary: 生成排产计划
      description: |
        基于订单列表（优先级 + 交付日期 + 物料齐套）+ 设备状态（device-service 查询 status/healthScore）+ 简单规则，
        生成"产品-机台-时段"排产计划，落 PostgreSQL `production_plans` 表，并由 LLM 生成自然语言说明。
        force_regenerate=true 时强制重新生成；无可排产订单时返回明确提示，不强行生成空计划。
      operationId: generateSchedulerPlan
      requestBody:
        required: false
        description: 排产计划生成请求体（可传空对象）
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulerPlanGenerateRequest'
            examples:
              force:
                summary: 强制重新生成
                value:
                  force_regenerate: true
      responses:
        '200':
          description: 排产计划生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerPlanResponse'
              examples:
                plan:
                  summary: 排产计划示例
                  value:
                    plan_id: 7
                    plan_version: 3
                    allocations:
                      - order_no: ORD-2026-0001
                        product_model: PCBA-A
                        device_id: 1001
                        device_name: 贴片机-01
                        start_hour: 0
                        duration_hours: 8.0
                    description: URGENT 订单优先排产，已按交付日期升序分配至可用设备。
                    status: ACTIVE
                    created_at: '2026-07-06T08:30:00Z'
        '400':
          description: 无可排产订单（订单为空或物料未齐套）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noOrders:
                  summary: 无可排产订单
                  value:
                    error: NO_AVAILABLE_ORDERS
                    message: 无可用订单（订单为空或物料未齐套）
        '503':
          description: 依赖的 Java 服务（smt-device-service）或 LLM 不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                upstream:
                  summary: 上游服务不可达
                  value:
                    error: UPSTREAM_UNAVAILABLE
                    message: 上游服务暂不可用
  /api/agent/scheduler/plan/current:
    get:
      tags:
        - 调度智能体
      summary: 查询当前排产计划
      description: 返回当前生效的排产计划（production_plans 表中最新一条 ACTIVE 记录）。
      operationId: getCurrentSchedulerPlan
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerPlanResponse'
              examples:
                current:
                  summary: 当前计划示例
                  value:
                    plan_id: 7
                    plan_version: 3
                    allocations:
                      - order_no: ORD-2026-0001
                        product_model: PCBA-A
                        device_id: 1001
                        device_name: 贴片机-01
                        start_hour: 0
                        duration_hours: 8.0
                    description: URGENT 订单优先排产，已按交付日期升序分配至可用设备。
                    status: ACTIVE
                    created_at: '2026-07-06T08:30:00Z'
        '404':
          description: 当前无生效排产计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noPlan:
                  summary: 无当前计划
                  value:
                    error: PLAN_NOT_FOUND
                    message: 当前无生效排产计划
  /api/agent/scheduler/urgent:
    post:
      tags:
        - 调度智能体
      summary: 急单插单与影响评估
      description: |
        急单插入与影响评估：录入急单到 production_orders 表（priority=URGENT），
        比对当前 production_plans 找出受影响订单列表与延迟时长，
        由 LLM 生成调整方案（换线建议 / 加班建议）。
      operationId: evaluateUrgentOrder
      requestBody:
        required: true
        description: 急单插单请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulerUrgentRequest'
            examples:
              urgent:
                summary: 急单插单示例
                value:
                  order_no: URGENT-2026-0001
                  product_model: PCBA-B
                  quantity: 2000
                  delivery_date: '2026-07-08'
      responses:
        '200':
          description: 急单影响评估成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerUrgentResponse'
              examples:
                urgent:
                  summary: 急单评估结果示例
                  value:
                    urgent_order_no: URGENT-2026-0001
                    affected_orders:
                      - order_no: ORD-2026-0001
                        product_model: PCBA-A
                        delay_hours: 4.5
                    estimated_delay_hours: 4.5
                    adjustment_plan:
                      changeover_suggestion: 建议在 02:00-04:00 时段换线至 PCBA-B，对夜班影响最小
                      overtime_suggestion: 建议安排 4 小时加班以追回延误产能
        '400':
          description: 参数错误（必填字段缺失或 quantity 非法）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  summary: 必填字段缺失
                  value:
                    error: INVALID_URGENT_ORDER
                    message: 订单号、产品型号、数量、交付日期均为必填
  /api/agent/orchestrator/device_fault:
    post:
      tags:
        - Agent 编排
      summary: 设备故障协同处理
      description: |
        基于 LangGraph StateGraph 编排的多 Agent 协同处理入口。
        依次调用 maintenance/quality/scheduler 三个 Agent：
        1. maintenance Agent /diagnose 生成根因与维修建议
        2. quality Agent /root_cause 评估是否影响质量
        3. scheduler Agent /urgent 生成排产调整方案
        子 Agent 不可达时降级（写入 state.errors），不阻断整体工作流。
      operationId: orchestrateDeviceFault
      requestBody:
        required: true
        description: 设备故障协同处理请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestratorDeviceFaultRequest'
            examples:
              fault:
                summary: 设备故障协同示例
                value:
                  device_id: 1001
                  symptom: X 轴异响
      responses:
        '200':
          description: 协同处理完成（含降级场景）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestratorWorkflowResponse'
              examples:
                success:
                  summary: 协同成功示例
                  value:
                    workflow_id: wf-2026-0001
                    status: SUCCESS
                    diagnosis:
                      root_causes:
                        - X 轴导轨润滑不足
                      repair_suggestions:
                        - 立即补充 X 轴导轨润滑油
                      similar_cases: []
                    quality_assessment:
                      root_causes:
                        - category: 机
                          cause: X 轴定位精度下降导致贴片偏移
                      corrective_actions:
                        - 校准 X 轴定位精度后复测首件
                      similar_cases: []
                    schedule_adjustment:
                      urgent_order_no: URGENT-2026-0001
                      affected_orders:
                        - order_no: ORD-2026-0001
                          product_model: PCBA-A
                          delay_hours: 2.0
                      estimated_delay_hours: 2.0
                      adjustment_plan:
                        changeover_suggestion: 建议暂停设备 1001 排产 2 小时
                        overtime_suggestion: 安排 2 小时加班补足延误
                    summary: 设备 1001 X 轴异响由导轨润滑不足引起，已建议立即补油；质量侧可能产生贴片偏移；调度侧建议暂停排产 2 小时并安排加班。
                    errors: {}
        '400':
          description: 参数错误（device_id 缺失或 symptom 为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptySymptom:
                  summary: 故障现象为空
                  value:
                    error: INVALID_SYMPTOM
                    message: 故障现象不能为空
        '500':
          description: 编排流程内部异常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internal:
                  summary: 编排内部异常
                  value:
                    error: ORCHESTRATION_FAILED
                    message: 编排流程执行失败
  /api/agent/orchestrator/workflows/{workflow_id}:
