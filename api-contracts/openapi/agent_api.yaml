        alert_time:
          type: string
          format: date-time
          description: 告警时间（ISO-8601）
          example: '2026-07-06T08:30:05Z'
    QualityAlertsPageResponse:
      type: object
      description: 质量告警分页响应
      required:
        - records
        - total
        - page
        - size
      properties:
        records:
          type: array
          description: 告警记录列表（按告警时间倒序）
          items:
            $ref: '#/components/schemas/QualityAlertRecord'
        total:
          type: integer
          description: 总记录数
          example: 1
        page:
          type: integer
          description: 当前页码
          example: 1
        size:
          type: integer
          description: 每页大小
          example: 20
    SchedulerOrderCreateRequest:
      type: object
      description: 订单创建请求体
      required:
        - order_no
        - product_model
        - quantity
        - delivery_date
        - material_ready
      properties:
        order_no:
          type: string
          description: 订单号
          example: ORD-2026-0001
        product_model:
          type: string
          description: 产品型号
          example: PCBA-A
        quantity:
          type: integer
          description: 订单数量
          minimum: 1
          example: 5000
        priority:
          type: string
          description: 优先级
          enum:
            - URGENT
            - HIGH
            - NORMAL
            - LOW
          default: NORMAL
          example: NORMAL
        delivery_date:
          type: string
          format: date
          description: 交付日期（ISO-8601 date）
          example: '2026-07-15'
        material_ready:
          type: boolean
          description: 物料是否齐套
          example: true
    SchedulerOrderResponse:
      type: object
      description: 订单响应
      required:
        - order_id
        - order_no
        - product_model
        - quantity
        - priority
        - delivery_date
        - material_ready
        - status
        - created_at
      properties:
        order_id:
          type: integer
          format: int64
          description: 订单 ID
          example: 1
        order_no:
          type: string
          description: 订单号
          example: ORD-2026-0001
        product_model:
          type: string
          description: 产品型号
          example: PCBA-A
        quantity:
          type: integer
          description: 订单数量
          example: 5000
        priority:
          type: string
          description: 优先级
          enum:
            - URGENT
            - HIGH
            - NORMAL
            - LOW
          example: NORMAL
        delivery_date:
          type: string
          format: date
          description: 交付日期
          example: '2026-07-15'
        material_ready:
          type: boolean
          description: 物料是否齐套
          example: true
        status:
          type: string
          description: 订单状态
          enum:
            - PENDING
            - PLANNED
            - COMPLETED
            - CANCELLED
          example: PENDING
        created_at:
          type: string
          format: date-time
          description: 创建时间（ISO-8601）
          example: '2026-07-06T08:30:00Z'
    SchedulerOrderListResponse:
      type: object
      description: 订单列表响应
      required:
        - records
        - total
      properties:
        records:
          type: array
          description: 订单列表
          items:
            $ref: '#/components/schemas/SchedulerOrderResponse'
        total:
          type: integer
          description: 总订单数
          example: 1
    SchedulerPlanGenerateRequest:
      type: object
      description: 排产计划生成请求体（可传空对象）
      properties:
        force_regenerate:
          type: boolean
          description: 是否强制重新生成（默认 false，仅在无 ACTIVE 计划或订单变化时生成）
          default: false
          example: false
    SchedulerPlanAllocation:
      type: object
      description: 排产计划分配项
      required:
        - order_no
        - product_model
        - device_id
        - device_name
        - start_hour
        - duration_hours
      properties:
        order_no:
          type: string
          description: 订单号
          example: ORD-2026-0001
        product_model:
          type: string
          description: 产品型号
          example: PCBA-A
        device_id:
          type: integer
          format: int64
          description: 分配设备 ID
          example: 1001
        device_name:
          type: string
          description: 设备名称
          example: 贴片机-01
        start_hour:
          type: integer
          description: 起始时段（从 0 点开始的偏移小时数）
          minimum: 0
          example: 0
        duration_hours:
          type: number
          format: float
          description: 占用时长（小时）
          example: 8.0
    SchedulerPlanResponse:
      type: object
      description: 排产计划响应
      required:
        - plan_id
        - plan_version
        - allocations
        - description
        - status
        - created_at
      properties:
        plan_id:
          type: integer
          format: int64
          description: 计划 ID
          example: 7
        plan_version:
          type: integer
          description: 计划版本号
          example: 3
        allocations:
          type: array
          description: 订单-设备-时段分配列表
          items:
            $ref: '#/components/schemas/SchedulerPlanAllocation'
        description:
          type: string
          description: 计划说明文本（LLM 生成，≤200 字）
          example: URGENT 订单优先排产，已按交付日期升序分配至可用设备。
        status:
          type: string
          description: 计划状态
          enum:
            - ACTIVE
            - SUPERSEDED
            - DRAFT
          example: ACTIVE
        created_at:
          type: string
          format: date-time
          description: 创建时间（ISO-8601）
          example: '2026-07-06T08:30:00Z'
    SchedulerUrgentRequest:
      type: object
      description: 急单插单请求体
      required:
        - order_no
        - product_model
        - quantity
        - delivery_date
      properties:
        order_no:
          type: string
          description: 急单订单号
          example: URGENT-2026-0001
        product_model:
          type: string
          description: 产品型号
          example: PCBA-B
        quantity:
          type: integer
          description: 订单数量
          minimum: 1
          example: 2000
        delivery_date:
          type: string
          format: date
          description: 交付日期（ISO-8601 date）
          example: '2026-07-08'
        source:
          type: string
          description: 订单来源（user/orchestrator_synthetic），用于追溯合成急单
          default: user
          example: user
    SchedulerAffectedOrder:
      type: object
      description: 受急单影响的订单
      required:
        - order_no
        - product_model
        - delay_hours
      properties:
        order_no:
          type: string
          description: 受影响订单号
          example: ORD-2026-0001
        product_model:
          type: string
          description: 产品型号
          example: PCBA-A
        delay_hours:
          type: number
          format: float
          description: 延迟小时数
          minimum: 0
          example: 4.5
    SchedulerAdjustmentPlan:
      type: object
      description: 急单调整方案
      required:
        - changeover_suggestion
        - overtime_suggestion
      properties:
        changeover_suggestion:
          type: string
          description: 换线建议（LLM 生成）
          example: 建议在 02:00-04:00 时段换线至 PCBA-B，对夜班影响最小
        overtime_suggestion:
          type: string
          description: 加班建议（LLM 生成）
          example: 建议安排 4 小时加班以追回延误产能
    SchedulerUrgentResponse:
      type: object
      description: 急单影响评估响应
      required:
        - urgent_order_no
        - affected_orders
        - estimated_delay_hours
        - adjustment_plan
      properties:
        urgent_order_no:
          type: string
          description: 急单订单号
          example: URGENT-2026-0001
        affected_orders:
          type: array
          description: 受影响订单列表
          items:
            $ref: '#/components/schemas/SchedulerAffectedOrder'
        estimated_delay_hours:
          type: number
          format: float
          description: 预计总延迟小时数
          minimum: 0
          example: 4.5
        adjustment_plan:
          $ref: '#/components/schemas/SchedulerAdjustmentPlan'
    OrchestratorDeviceFaultRequest:
      type: object
      description: 设备故障协同处理请求体
      required:
        - device_id
        - symptom
      properties:
        device_id:
          type: integer
          format: int64
          description: 设备 ID
          minimum: 1
          example: 1001
        symptom:
          type: string
          description: 故障现象描述
          example: X 轴异响
    OrchestratorWorkflowResponse:
      type: object
      description: 工作流协同响应
      required:
        - workflow_id
        - status
        - errors
      properties:
        workflow_id:
          type: string
          description: 工作流 ID
          example: wf-2026-0001
        status:
          type: string
          description: 工作流状态
          enum:
            - SUCCESS
            - PARTIAL
            - FAILED
          example: SUCCESS
        diagnosis:
          type: object
          description: maintenance Agent 诊断结果（不可达时为 null）
          nullable: true
          additionalProperties: true
          example:
            root_causes:
              - X 轴导轨润滑不足
            repair_suggestions:
              - 立即补充 X 轴导轨润滑油
            similar_cases: []
        quality_assessment:
          type: object
          description: quality Agent 评估结果（不可达时为 null 或降级对象）
          nullable: true
          additionalProperties: true
          example:
            root_causes:
              - category: 机
                cause: X 轴定位精度下降导致贴片偏移
            corrective_actions:
              - 校准 X 轴定位精度后复测首件
            similar_cases: []
        schedule_adjustment:
          type: object
          description: scheduler Agent 调整方案（不可达时为 null）
          nullable: true
          additionalProperties: true
          example:
            urgent_order_no: URGENT-2026-0001
            affected_orders:
              - order_no: ORD-2026-0001
                product_model: PCBA-A
                delay_hours: 2.0
            estimated_delay_hours: 2.0
            adjustment_plan:
              changeover_suggestion: 建议暂停设备 1001 排产 2 小时
              overtime_suggestion: 安排 2 小时加班补足延误
        summary:
          type: string
          description: 工作流总结（LLM 生成，可能为 null）
          nullable: true
          example: 设备 1001 X 轴异响由导轨润滑不足引起，已建议立即补油；质量侧可能产生贴片偏移；调度侧建议暂停排产 2 小时并安排加班。
        errors:
          type: object
          description: 各节点错误信息（key 为节点名，value 为错误描述；正常时为空对象）
          additionalProperties: true
          example: {}
