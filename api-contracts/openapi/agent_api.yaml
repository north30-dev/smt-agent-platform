components:
  parameters:
    DocIdPathParam:
      name: doc_id
      in: path
      description: 知识库文档 ID
      required: true
      schema:
        type: string
        example: doc-2026-0001
    DeviceIdPathParam:
      name: device_id
      in: path
      description: 设备 ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1001
  schemas:
    ErrorResponse:
      type: object
      description: 错误响应
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 错误码（大写蛇形，如 INVALID_FILE、DEVICE_NOT_FOUND）
          example: INVALID_FILE
        message:
          type: string
          description: 错误描述
          example: 上传文件不能为空
    KnowledgeUploadRequest:
      type: object
      description: 知识文档上传请求体（multipart/form-data）
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: 待上传的文档文件（支持 PDF/Word/TXT/Markdown）
    KnowledgeUploadResponse:
      type: object
      description: 知识文档上传响应
      required:
        - doc_id
        - doc_name
        - chunk_count
      properties:
        doc_id:
          type: string
          description: 文档 ID
          example: doc-2026-0001
        doc_name:
          type: string
          description: 文档名称
          example: SMT印刷机维护手册.pdf
        chunk_count:
          type: integer
          description: 分块数量
          example: 42
    KnowledgeAskRequest:
      type: object
      description: 知识库问答请求体
      required:
        - question
      properties:
        question:
          type: string
          description: 用户问题
          example: 印刷机钢网清洁频率应该是多少？
    KnowledgeSource:
      type: object
      description: 知识库问答来源片段
      required:
        - doc_id
        - chunk_id
        - score
        - snippet
      properties:
        doc_id:
          type: string
          description: 来源文档 ID
          example: doc-2026-0001
        chunk_id:
          type: string
          description: 来源分块 ID
          example: chunk-003
        score:
          type: number
          format: float
          description: 相似度得分（0-1，越大越相关）
          minimum: 0
          maximum: 1
          example: 0.92
        snippet:
          type: string
          description: 命中文本片段
          example: 钢网清洁：每班次生产结束后使用专用清洗剂...
    KnowledgeAskResponse:
      type: object
      description: 知识库问答响应
      required:
        - answer
        - sources
      properties:
        answer:
          type: string
          description: 大模型生成的答案
          example: 建议每班次生产结束后清洁钢网一次...
        sources:
          type: array
          description: 命中的来源片段列表
          items:
            $ref: '#/components/schemas/KnowledgeSource'
    KnowledgeDocument:
      type: object
      description: 知识库文档元信息
      required:
        - doc_id
        - doc_name
        - chunk_count
        - create_time
      properties:
        doc_id:
          type: string
          description: 文档 ID
          example: doc-2026-0001
        doc_name:
          type: string
          description: 文档名称
          example: SMT印刷机维护手册.pdf
        chunk_count:
          type: integer
          description: 分块数量
          example: 42
        create_time:
          type: string
          format: date-time
          description: 入库时间（ISO-8601）
          example: '2026-06-27T08:30:00Z'
    KnowledgeDocumentListResponse:
      type: array
      description: 知识库文档列表
      items:
        $ref: '#/components/schemas/KnowledgeDocument'
    KnowledgeDeleteResponse:
      type: object
      description: 知识库文档删除响应
      required:
        - success
        - deleted_chunks
      properties:
        success:
          type: boolean
          description: 是否删除成功
          example: true
        deleted_chunks:
          type: integer
          description: 实际删除的分块数量
          example: 42
    MaintenanceHealthResponse:
      type: object
      description: 设备健康评分响应
      required:
        - device_id
        - health_score
        - status
        - risk_level
        - analysis
      properties:
        device_id:
          type: integer
          format: int64
          description: 设备 ID
          example: 1001
        health_score:
          type: integer
          description: 健康评分（0-100，分数越高越健康）
          minimum: 0
          maximum: 100
          example: 88
        status:
          type: string
          description: 设备运行状态
          example: RUNNING
        risk_level:
          type: string
          description: 风险等级
          enum:
            - LOW
            - MEDIUM
            - HIGH
          example: LOW
        analysis:
          type: string
          description: 运维分析文本（大模型生成）
          example: 设备运行平稳，温度与振动指标均在阈值范围内。
    MaintenanceDiagnoseRequest:
      type: object
      description: 故障诊断请求体
      required:
        - device_id
        - symptom
      properties:
        device_id:
          type: integer
          format: int64
          description: 设备 ID
          example: 1001
        symptom:
          type: string
          description: 故障现象描述
          example: 贴片机主轴振动幅值持续偏高
    MaintenanceSimilarCase:
      type: object
      description: 相似历史案例
      required:
        - case_id
        - symptom
        - root_cause
        - solution
        - score
      properties:
        case_id:
          type: string
          description: 案例 ID
          example: case-0057
        symptom:
          type: string
          description: 故障现象
          example: 主轴振动偏高伴随异响
        root_cause:
          type: string
          description: 根因
          example: 主轴轴承磨损
        solution:
          type: string
          description: 解决方案
          example: 更换主轴轴承并复测振动
        score:
          type: number
          format: float
          description: 相似度得分（0-1）
          minimum: 0
          maximum: 1
          example: 0.87
    MaintenanceDiagnoseResponse:
      type: object
      description: 故障诊断响应
      required:
        - root_causes
        - repair_suggestions
        - similar_cases
      properties:
        root_causes:
          type: array
          description: 可能的根因列表
          items:
            type: string
          example:
            - 主轴轴承磨损
            - 安装基础松动
        repair_suggestions:
          type: array
          description: 维修建议列表
          items:
            type: string
          example:
            - 检查并更换主轴轴承
            - 重新校准设备安装水平
        similar_cases:
          type: array
          description: 相似历史案例列表
          items:
            $ref: '#/components/schemas/MaintenanceSimilarCase'
    MaintenanceThresholdAlert:
      type: object
      description: 阈值越限告警
      required:
        - datapoint_code
        - current_value
        - threshold
        - severity
      properties:
        datapoint_code:
          type: string
          description: 采集点编码
          example: TEMP-01
        current_value:
          type: number
          format: float
          description: 当前值
          example: 78.5
        threshold:
          type: number
          format: float
          description: 阈值
          example: 85.0
        severity:
          type: string
          description: 严重等级
          enum:
            - INFO
            - WARNING
            - CRITICAL
          example: WARNING
    MaintenanceForecast:
      type: object
      description: 指标预测结果
      required:
        - datapoint_code
        - predicted_value
        - hours_to_threshold
      properties:
        datapoint_code:
          type: string
          description: 采集点编码
          example: TEMP-01
        predicted_value:
          type: number
          format: float
          description: 预测值
          example: 86.2
        hours_to_threshold:
          type: integer
          description: 预计到达阈值的小时数
          example: 12
    MaintenancePredictResponse:
      type: object
      description: 设备趋势预测响应
      required:
        - trend
        - threshold_alerts
        - forecast
        - recommendation
        - data_sufficient
      properties:
        trend:
          type: string
          description: 趋势方向（上升/下降/平稳）
          example: 上升
        threshold_alerts:
          type: array
          description: 阈值越限告警列表
          items:
            $ref: '#/components/schemas/MaintenanceThresholdAlert'
        forecast:
          $ref: '#/components/schemas/MaintenanceForecast'
        recommendation:
          type: string
          description: 运维建议（大模型生成）
          example: 建议在 12 小时内检查散热系统并降低负载。
        data_sufficient:
          type: boolean
          description: 历史数据是否足以支撑预测
          example: true
    MaintenanceCaseCreateRequest:
      type: object
      description: 运维案例创建请求体
      required:
        - device_type
        - symptom
        - root_cause
        - solution
      properties:
        device_type:
          type: string
          description: 设备类型
          example: MOUNTER
        symptom:
          type: string
          description: 故障现象
          example: 主轴振动偏高伴随异响
        root_cause:
          type: string
          description: 根因
          example: 主轴轴承磨损
        solution:
          type: string
