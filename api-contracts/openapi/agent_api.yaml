        timestamp:
          type: string
          format: date-time
          description: 采集时间（ISO-8601）
          example: '2026-07-06T08:30:00Z'
    QualityMonitorResponse:
      type: object
      description: 不良实时监控响应
      required:
        - device_id
        - defect_rate
        - threshold
        - status
        - datapoints
        - analyzed_at
      properties:
        device_id:
          type: integer
