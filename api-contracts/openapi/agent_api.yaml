        device_id:
          type: integer
          format: int64
          description: 设备 ID
          example: 1001
        defect_description:
          type: string
          description: 缺陷描述
          example: 贴片偏移率 5%
    QualityRootCause:
      type: object
      description: 根因假设（按人/机/料/法/环分类）
      required:
        - category
        - cause
      properties:
        category:
          type: string
          description: 五要素分类（人/机/料/法/环）
          example: 机
        cause:
          type: string
          description: 根因描述
          example: 贴装头 Z 轴校准漂移
    QualitySimilarCase:
      type: object
