openapi: 3.0.3
info:
  title: SMT Python Agent REST API
  description: |
    SMT 智能运维平台 Python 智能体对外 RESTful 接口契约。

    覆盖两个 Python Agent：
    - agent-knowledge（端口 8004）：知识助手 RAG 问答，支持文档上传、向量检索问答、文档列表与删除。
    - agent-maintenance（端口 8002）：设备运维 Agent，支持健康评分、故障诊断、趋势预测、案例沉淀。

    外部访问路径前缀 `/api/agent/**` 经 `smt-gateway` 网关路由到对应 Python 服务，
    网关 `StripPrefix=2` 后 Python 服务收到 `/knowledge/**` 与 `/maintenance/**`。
    响应体为业务对象直返（不使用 Result 包装），字段命名采用 snake_case 与 Python Pydantic 默认对齐。
  version: 1.0.0
  contact:
    name: smt-agent-platform
    url: https://github.com/north30/smt-agent-platform
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080
    description: 本地开发环境（经 smt-gateway 网关）
tags:
  - name: 知识助手
    description: agent-knowledge 知识助手 RAG 问答相关接口
  - name: 设备运维
    description: agent-maintenance 设备运维 Agent 相关接口
  - name: 质量分析
    description: agent-quality 质量分析 Agent 相关接口（不良监控、根因分析、案例录入、告警查询）
  - name: 调度智能体
    description: agent-scheduler 调度智能体相关接口（订单录入、排产计划、急单响应）
  - name: Agent 编排
    description: agent-orchestrator 多 Agent 协同编排相关接口（设备故障协同处理、工作流查询）
paths:
  /api/agent/knowledge/upload:
    post:
      tags:
        - 知识助手
      summary: 上传知识文档
      description: |
        以 multipart/form-data 方式上传文档（PDF/Word/TXT/Markdown 等），服务端完成解析、分块、向量化后写入 Milvus。
        返回新文档的 ID、名称与分块数量。
      operationId: uploadKnowledgeDocument
      requestBody:
        required: true
        description: 待上传的文档文件
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KnowledgeUploadRequest'
      responses:
        '200':
          description: 上传并入库成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeUploadResponse'
              examples:
                success:
                  summary: 上传成功
                  value:
                    doc_id: doc-2026-0001
                    doc_name: SMT印刷机维护手册.pdf
                    chunk_count: 42
        '400':
          description: 参数错误（文件为空、格式不支持、文件过大等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyFile:
                  summary: 文件为空
                  value:
                    error: INVALID_FILE
                    message: 上传文件不能为空
  /api/agent/knowledge/ask:
    post:
      tags:
        - 知识助手
      summary: 知识库问答
      description: |
        基于已入库文档构建的知识库进行 RAG 检索增强问答：先在 Milvus 中检索与问题最相关的文本块，
        再交由大模型生成答案，并返回命中的来源片段（含 doc_id、chunk_id、相似度得分、内容片段）。
      operationId: askKnowledge
      requestBody:
        required: true
        description: 问答请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeAskRequest'
            examples:
              printer:
                summary: 印刷机保养问题
                value:
                  question: 印刷机钢网清洁频率应该是多少？
      responses:
        '200':
          description: 问答成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAskResponse'
              examples:
                answer:
                  summary: 问答示例
                  value:
                    answer: 建议每班次生产结束后清洁钢网一次...
                    sources:
                      - doc_id: doc-2026-0001
                        chunk_id: chunk-003
                        score: 0.92
                        snippet: 钢网清洁：每班次生产结束后使用专用清洗剂...
        '400':
          description: 参数错误（question 为空或超长）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyQuestion:
                  summary: 问题为空
                  value:
                    error: INVALID_QUESTION
                    message: 问题不能为空
  /api/agent/knowledge/documents:
    get:
      tags:
        - 知识助手
      summary: 查询知识库文档列表
      description: 返回当前知识库中全部已入库文档的元信息列表，按入库时间倒序。
      operationId: listKnowledgeDocuments
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDocumentListResponse'
              examples:
                list:
                  summary: 文档列表示例
                  value:
                    - doc_id: doc-2026-0001
                      doc_name: SMT印刷机维护手册.pdf
                      chunk_count: 42
                      create_time: '2026-06-27T08:30:00Z'
  /api/agent/knowledge/documents/{doc_id}:
    delete:
      tags:
        - 知识助手
      summary: 删除知识库文档
      description: |
        根据文档 ID 删除知识库中的文档及其全部分块向量，返回是否删除成功与实际删除的分块数量。
      operationId: deleteKnowledgeDocument
      parameters:
        - $ref: '#/components/parameters/DocIdPathParam'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeDeleteResponse'
              examples:
                success:
                  summary: 删除成功
                  value:
                    success: true
                    deleted_chunks: 42
        '400':
          description: 参数错误（doc_id 格式不合法）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: 文档 ID 不合法
                  value:
                    error: INVALID_DOC_ID
                    message: 文档 ID 格式不合法
  /api/agent/maintenance/health/{device_id}:
    get:
      tags:
        - 设备运维
      summary: 设备健康评分
      description: |
        根据设备 ID 查询设备健康评分、运行状态、风险等级与运维分析文本。
        依赖 smt-device-service 提供的设备元信息与历史数据，Java 服务不可达时返回 503。
      operationId: getDeviceHealth
      parameters:
        - $ref: '#/components/parameters/DeviceIdPathParam'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceHealthResponse'
              examples:
                health:
                  summary: 健康评分示例
                  value:
                    device_id: 1001
                    health_score: 88
                    status: RUNNING
                    risk_level: LOW
                    analysis: 设备运行平稳，温度与振动指标均在阈值范围内。
        '400':
          description: 参数错误（device_id 不合法）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: 设备 ID 不合法
                  value:
                    error: INVALID_DEVICE_ID
                    message: 设备 ID 不合法
        '503':
          description: 依赖的 Java 服务（smt-device-service）不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                upstream:
                  summary: Java 服务不可达
                  value:
                    error: UPSTREAM_UNAVAILABLE
                    message: 设备服务暂不可用
  /api/agent/maintenance/diagnose:
    post:
      tags:
        - 设备运维
      summary: 故障诊断
      description: |
        根据设备 ID 与故障现象描述，结合历史案例库与大模型进行根因分析，
        返回可能的根因列表、维修建议列表以及相似历史案例（含相似度得分）。
        诊断过程可能调用 smt-device-service 获取设备上下文，Java 服务不可达时返回 503。
      operationId: diagnoseDevice
      requestBody:
        required: true
        description: 故障诊断请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceDiagnoseRequest'
            examples:
              vibration:
                summary: 振动异常诊断
                value:
                  device_id: 1001
                  symptom: 贴片机主轴振动幅值持续偏高
      responses:
        '200':
          description: 诊断成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceDiagnoseResponse'
              examples:
                diagnose:
                  summary: 诊断结果示例
                  value:
                    root_causes:
                      - 主轴轴承磨损
                      - 安装基础松动
                    repair_suggestions:
                      - 检查并更换主轴轴承
                      - 重新校准设备安装水平
                    similar_cases:
                      - case_id: case-0057
                        symptom: 主轴振动偏高伴随异响
                        root_cause: 主轴轴承磨损
                        solution: 更换主轴轴承并复测振动
                        score: 0.87
        '400':
          description: 参数错误（device_id 缺失或 symptom 为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptySymptom:
                  summary: 故障现象为空
                  value:
                    error: INVALID_SYMPTOM
                    message: 故障现象不能为空
        '503':
          description: 依赖的 Java 服务（smt-device-service）不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                upstream:
                  summary: Java 服务不可达
                  value:
                    error: UPSTREAM_UNAVAILABLE
                    message: 设备服务暂不可用
  /api/agent/maintenance/predict/{device_id}:
    get:
      tags:
        - 设备运维
      summary: 设备趋势预测
      description: |
        基于设备历史采集数据预测关键指标的未来走势，输出阈值越限告警、预测到达阈值的时间以及运维建议。
        当历史数据不足以支撑预测时 `data_sufficient=false` 并返回空预测。
        依赖 smt-device-service 提供历史数据，Java 服务不可达时返回 503。
      operationId: predictDeviceTrend
      parameters:
        - $ref: '#/components/parameters/DeviceIdPathParam'
      responses:
        '200':
          description: 预测成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenancePredictResponse'
              examples:
                predict:
                  summary: 预测结果示例
                  value:
                    trend: 上升
                    threshold_alerts:
                      - datapoint_code: TEMP-01
                        current_value: 78.5
                        threshold: 85.0
                        severity: WARNING
                    forecast:
                      datapoint_code: TEMP-01
                      predicted_value: 86.2
                      hours_to_threshold: 12
                    recommendation: 建议在 12 小时内检查散热系统并降低负载。
                    data_sufficient: true
        '400':
          description: 参数错误（device_id 不合法）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: 设备 ID 不合法
                  value:
                    error: INVALID_DEVICE_ID
                    message: 设备 ID 不合法
        '503':
          description: 依赖的 Java 服务（smt-device-service）不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                upstream:
                  summary: Java 服务不可达
                  value:
                    error: UPSTREAM_UNAVAILABLE
                    message: 设备服务暂不可用
  /api/agent/maintenance/cases:
    post:
      tags:
        - 设备运维
      summary: 新增运维案例
      description: |
        将一次运维处置经验沉淀为案例写入案例库（Milvus），供后续诊断检索复用。
        请求体包含设备类型、故障现象、根因与解决方案，返回新建案例 ID。
      operationId: createMaintenanceCase
      requestBody:
        required: true
        description: 运维案例创建请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCaseCreateRequest'
            examples:
              case:
                summary: 案例创建示例
                value:
                  device_type: MOUNTER
                  symptom: 主轴振动偏高伴随异响
                  root_cause: 主轴轴承磨损
                  solution: 更换主轴轴承并复测振动
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceCaseCreateResponse'
              examples:
                success:
                  summary: 创建成功
                  value:
                    case_id: case-0058
        '400':
          description: 参数错误（必填字段缺失）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  summary: 必填字段缺失
                  value:
                    error: INVALID_CASE
                    message: 设备类型、故障现象、根因、解决方案均为必填
  /api/agent/quality/monitor/{device_id}:
    get:
      tags:
        - 质量分析
      summary: 不良实时监控
      description: |
        拉取设备最新 AOI/SPI 检测类数据点，按阈值实时计算不良率与告警状态。
        超阈值告警同步落库到 PostgreSQL `quality_alerts` 表。
        依赖 smt-device-service 提供数据点，Java 服务不可达时返回 503；
        当设备近 1 小时无 AOI 数据点时返回 `status=INSUFFICIENT_DATA`。
      operationId: getQualityMonitor
      parameters:
        - $ref: '#/components/parameters/DeviceIdPathParam'
      responses:
        '200':
          description: 监控数据返回成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityMonitorResponse'
              examples:
                alert:
                  summary: 超阈值告警示例
                  value:
                    device_id: 1001
                    defect_rate: 0.025
                    threshold: 0.02
                    status: ALERT
                    datapoints:
                      - datapoint_code: AOI_DEFECT_RATE
                        value: 0.025
                        timestamp: '2026-07-06T08:30:00Z'
                    analyzed_at: '2026-07-06T08:30:05Z'
        '503':
          description: 依赖的 Java 服务（smt-device-service）不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                upstream:
                  summary: Java 服务不可达
                  value:
                    error: UPSTREAM_UNAVAILABLE
                    message: 设备服务暂不可用
  /api/agent/quality/root_cause:
    post:
      tags:
        - 质量分析
      summary: 根因分析
      description: |
        基于"人/机/料/法/环"五要素框架，结合设备信息 + 历史质量案例 RAG + 大模型推理，
        输出根因假设列表与纠正措施。空案例库时仍返回 LLM 推理结果，similar_cases 返回空列表。
      operationId: analyzeQualityRootCause
      requestBody:
        required: true
        description: 根因分析请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityRootCauseRequest'
            examples:
              offset:
                summary: 贴片偏移根因分析
                value:
                  device_id: 1001
                  defect_description: 贴片偏移率 5%
      responses:
        '200':
          description: 根因分析成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityRootCauseResponse'
              examples:
                rootCause:
                  summary: 根因分析结果示例
                  value:
                    device_id: 1001
                    root_causes:
                      - category: 机
                        cause: 贴装头 Z 轴校准漂移
                      - category: 料
                        cause: 锡膏厚度异常
                    corrective_actions:
                      - 重新校准贴装头 Z 轴
                      - 检查钢网开口与锡膏黏度
                    similar_cases:
                      - case_id: qc-0023
                        description: 贴片偏移伴随锡膏厚度异常
                        root_cause: 钢网开口偏移 + 锡膏搅拌不均
                        corrective_action: 重新制作钢网并规范锡膏搅拌流程
                        score: 0.85
        '400':
          description: 参数错误（device_id 缺失或 defect_description 为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyDescription:
                  summary: 缺陷描述为空
                  value:
                    error: INVALID_DEFECT_DESCRIPTION
                    message: 缺陷描述不能为空
        '503':
          description: 依赖的 LLM 服务或向量库不可达
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                upstream:
                  summary: 上游服务不可达
                  value:
                    error: UPSTREAM_UNAVAILABLE
                    message: 上游服务暂不可用
  /api/agent/quality/cases:
    post:
      tags:
        - 质量分析
      summary: 录入质量案例
      description: |
        将历史质量案例（缺陷类型、描述、根因、纠正措施）向量化入库到 Milvus `smt_quality_cases` collection，
        供后续根因分析 RAG 检索复用。返回新案例 ID。
      operationId: createQualityCase
      requestBody:
        required: true
        description: 质量案例创建请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityCaseCreateRequest'
            examples:
              case:
                summary: 案例创建示例
                value:
                  defect_type: OFFSET
                  description: 贴片偏移率 5%，主要发生在 PCB 右下角
                  root_cause: 钢网开口偏移 + 锡膏搅拌不均
                  corrective_action: 重新制作钢网并规范锡膏搅拌流程
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityCaseCreateResponse'
              examples:
                success:
                  summary: 创建成功
                  value:
                    case_id: qc-0024
        '400':
          description: 参数错误（必填字段缺失）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  summary: 必填字段缺失
                  value:
                    error: INVALID_CASE
                    message: 缺陷类型、描述、根因、纠正措施均为必填
  /api/agent/quality/alerts:
    get:
      tags:
        - 质量分析
      summary: 查询质量告警
      description: 分页查询历史质量告警记录（来自 PostgreSQL `quality_alerts` 表），按告警时间倒序。
      operationId: listQualityAlerts
      parameters:
        - name: page
          in: query
          description: 页码（从 1 开始）
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: size
          in: query
          description: 每页大小
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityAlertsPageResponse'
              examples:
                page:
                  summary: 告警分页示例
                  value:
                    records:
                      - id: 158
                        device_id: 1001
                        defect_rate: 0.025
                        threshold: 0.02
                        status: ALERT
                        datapoint_code: AOI_DEFECT_RATE
                        alert_time: '2026-07-06T08:30:05Z'
                    total: 1
                    page: 1
                    size: 20
        '400':
          description: 参数错误（page/size 不合法）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPage:
                  summary: 分页参数不合法
                  value:
                    error: INVALID_PAGINATION
                    message: page 须 ≥1，size 须在 1-100 之间
  /api/agent/scheduler/orders:
    post:
      tags:
        - 调度智能体
      summary: 录入订单
      description: |
        录入订单到 PostgreSQL `production_orders` 表，含订单号、产品型号、数量、优先级、交付日期、物料齐套标记。
        录入后订单状态默认为 PENDING，等待排产计划生成。
      operationId: createSchedulerOrder
      requestBody:
        required: true
        description: 订单创建请求体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulerOrderCreateRequest'
            examples:
              order:
                summary: 订单创建示例
                value:
                  order_no: ORD-2026-0001
                  product_model: PCBA-A
                  quantity: 5000
                  priority: NORMAL
                  delivery_date: '2026-07-15'
                  material_ready: true
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerOrderResponse'
              examples:
                success:
                  summary: 创建成功
                  value:
                    order_id: 1
                    order_no: ORD-2026-0001
                    product_model: PCBA-A
                    quantity: 5000
                    priority: NORMAL
                    delivery_date: '2026-07-15'
                    material_ready: true
                    status: PENDING
                    created_at: '2026-07-06T08:30:00Z'
        '400':
          description: 参数错误（必填字段缺失或值非法）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  summary: 必填字段缺失
                  value:
                    error: INVALID_ORDER
                    message: 订单号、产品型号、数量、交付日期均为必填
    get:
      tags:
        - 调度智能体
      summary: 查询订单列表
      description: 查询订单列表，支持按状态筛选。返回订单总数与记录列表。
      operationId: listSchedulerOrders
      parameters:
        - name: status
          in: query
