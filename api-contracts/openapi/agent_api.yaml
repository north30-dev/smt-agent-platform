      required:
        - case_id
        - description
        - root_cause
        - corrective_action
        - score
      properties:
        case_id:
          type: string
          description: 案例 ID
          example: qc-0023
        description:
          type: string
          description: 案例描述
          example: 贴片偏移伴随锡膏厚度异常
        root_cause:
          type: string
          description: 案例根因
          example: 钢网开口偏移 + 锡膏搅拌不均
        corrective_action:
          type: string
          description: 案例纠正措施
          example: 重新制作钢网并规范锡膏搅拌流程
        score:
          type: number
          format: float
          description: 相似度得分（0-1）
          minimum: 0
          maximum: 1
          example: 0.85
    QualityRootCauseResponse:
      type: object
      description: 根因分析响应
      required:
        - device_id
        - root_causes
        - corrective_actions
        - similar_cases
      properties:
        device_id:
          type: integer
          format: int64
          description: 设备 ID
          example: 1001
        root_causes:
          type: array
          description: 根因假设列表（按五要素分类）
          items:
            $ref: '#/components/schemas/QualityRootCause'
        corrective_actions:
          type: array
          description: 纠正措施列表
          items:
            type: string
          example:
            - 重新校准贴装头 Z 轴
            - 检查钢网开口与锡膏黏度
        similar_cases:
          type: array
          description: 相似历史案例列表
          items:
            $ref: '#/components/schemas/QualitySimilarCase'
    QualityCaseCreateRequest:
      type: object
      description: 质量案例创建请求体
      required:
        - defect_type
        - description
        - root_cause
        - corrective_action
      properties:
        defect_type:
          type: string
          description: 缺陷类型（如 OFFSET、SHORT、OPEN、MISSING）
