        description:
          type: string
          description: 缺陷描述
          example: 贴片偏移率 5%，主要发生在 PCB 右下角
        root_cause:
          type: string
          description: 根因
          example: 钢网开口偏移 + 锡膏搅拌不均
        corrective_action:
          type: string
          description: 纠正措施
          example: 重新制作钢网并规范锡膏搅拌流程
    QualityCaseCreateResponse:
      type: object
      description: 质量案例创建响应
      required:
        - case_id
      properties:
        case_id:
          type: string
          description: 新建案例 ID
          example: qc-0024
    QualityAlertRecord:
      type: object
      description: 质量告警记录
      required:
        - id
        - device_id
        - defect_rate
        - threshold
        - status
        - alert_time
      properties:
        id:
          type: integer
          format: int64
          description: 告警记录 ID
          example: 158
        device_id:
          type: integer
          format: int64
          description: 设备 ID
          example: 1001
        defect_rate:
          type: number
          format: float
          description: 告警时不良率
          example: 0.025
        threshold:
          type: number
          format: float
          description: 不良率阈值
          example: 0.02
        status:
          type: string
          description: 告警状态
          example: ALERT
        datapoint_code:
          type: string
          description: 触发告警的采集点编码（无具体采集点时为 null）
