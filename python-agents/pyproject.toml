[tool.poetry]
name = "smt-python-agents"
version = "0.2.0"
description = "SMT 贴片产线智能运维平台 - Python 智能体层（Phase 2：知识助手 Agent + 设备运维 Agent）"
authors = ["north30-dev <north30dev@163.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
pyyaml = "^6.0.1"
pymilvus = "^2.4.0"
pypdf = "^4.0.0"
python-docx = "^1.1.0"
asyncpg = "^0.29.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
schemathesis = "^3.36.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end integration tests (deselect with '-m \"not integration\"')",
    "contract: OpenAPI contract tests via schemathesis (deselect with '-m \"not contract\"')",
]

[tool.coverage.run]
source = ["agent_knowledge", "agent_maintenance", "shared"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 50
