server:
  port: 8080

spring:
  # 默认 dev profile，生产由 ENV 覆盖（P0-3/P0-8）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: smt-gateway
  cloud:
    gateway:
      routes:
        # /api/device/** 转发至设备服务
        # 网关默认保留原始路径前缀，device-service 的 Controller 以 /api/device 为前缀，无需 StripPrefix
        - id: device-service
          # 后端服务地址环境变量化（P0-5）
          uri: http://${SMT_DEVICE_SERVICE_HOST:localhost}:${SMT_DEVICE_SERVICE_PORT:8081}
          predicates:
            - Path=/api/device/**
        # Phase 2 新增：Python Agent 路由
        # /api/agent/knowledge/** → agent-knowledge（8004），StripPrefix=2 剥离 /api/agent，Python 收到 /knowledge/**
        - id: agent-knowledge
          uri: http://${SMT_AGENT_KNOWLEDGE_HOST:localhost}:${SMT_AGENT_KNOWLEDGE_PORT:8004}
          predicates:
            - Path=/api/agent/knowledge/**
          filters:
            - StripPrefix=2
        # /api/agent/maintenance/** → agent-maintenance（8002），StripPrefix=2 剥离 /api/agent，Python 收到 /maintenance/**
        - id: agent-maintenance
          uri: http://${SMT_AGENT_MAINTENANCE_HOST:localhost}:${SMT_AGENT_MAINTENANCE_PORT:8002}
          predicates:
            - Path=/api/agent/maintenance/**
          filters:
            - StripPrefix=2
        # Phase 3 新增：质量分析 Agent 路由
        # /api/agent/quality/** → agent-quality（8003），StripPrefix=2 剥离 /api/agent，Python 收到 /quality/**
        - id: agent-quality
          uri: http://${SMT_AGENT_QUALITY_HOST:localhost}:${SMT_AGENT_QUALITY_PORT:8003}
          predicates:
            - Path=/api/agent/quality/**
          filters:
            - StripPrefix=2
        # Phase 3 新增：调度智能体路由
        # /api/agent/scheduler/** → agent-scheduler（8001），StripPrefix=2 剥离 /api/agent，Python 收到 /scheduler/**
        - id: agent-scheduler
          uri: http://${SMT_AGENT_SCHEDULER_HOST:localhost}:${SMT_AGENT_SCHEDULER_PORT:8001}
          predicates:
            - Path=/api/agent/scheduler/**
          filters:
            - StripPrefix=2
        # Phase 3 新增：Agent 编排服务路由
        # /api/agent/orchestrator/** → agent-orchestrator（8005），StripPrefix=2 剥离 /api/agent，Python 收到 /orchestrator/**
        - id: agent-orchestrator
          uri: http://${SMT_AGENT_ORCHESTRATOR_HOST:localhost}:${SMT_AGENT_ORCHESTRATOR_PORT:8005}
          predicates:
            - Path=/api/agent/orchestrator/**
          filters:
            - StripPrefix=2

# 注：logging 段已迁移到 logback-spring.xml（P0-8）

# JWT 鉴权配置（P0-4：网关 reactive WebFilter 校验 /api/agent/** 的 Bearer token）
# 密钥与 device-service 共用同一 ENV SMT_JWT_SECRET，保证签发/校验一致
smt:
  security:
    jwt:
      secret: ${SMT_JWT_SECRET:dev-only-please-change-me-in-production-32bytes}
      header: Authorization
      prefix: "Bearer "
