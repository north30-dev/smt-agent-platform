server:
  port: 8081

spring:
  # 默认 dev profile，生产由 ENV 覆盖（P0-3/P0-8）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: smt-device-service
  datasource:
    # 凭据环境变量化（P0-5），dev 默认值便于本地启动，生产由 ENV 覆盖
    url: jdbc:postgresql://${SMT_DB_HOST:localhost}:${SMT_DB_PORT:5432}/${SMT_DB_NAME:smt}
    username: ${SMT_DB_USERNAME:smt}
    password: ${SMT_DB_PASSWORD:smt123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${SMT_REDIS_HOST:localhost}
      port: ${SMT_REDIS_PORT:6379}
      password: ${SMT_REDIS_PASSWORD:root}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0
  kafka:
    bootstrap-servers: ${SMT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: smt-device-service
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # M4 修复：未匹配路径抛 NoHandlerFoundException，由 GlobalExceptionHandler 返回 JSON 404
  mvc:
    throw-exception-if-no-handler-found: true

# MyBatis-Plus 配置
# 注：log-impl 已迁移到 application-dev.yml/application-prod.yml（P0-8 日志 Profile 隔离）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smt.platform.device.model
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 可观测性（P0-7）：暴露 health/info/prometheus/metrics 端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# SMT 业务自定义配置
smt:
  # 安全配置（P0-4 RBAC 骨架）
  security:
    # JWT 配置（P0-5 凭据环境变量化）
    jwt:
      secret: ${SMT_JWT_SECRET:dev-only-jwt-secret-key-please-change-in-production-32bytes-min}
      header: Authorization
      prefix: "Bearer "
      expiry-seconds: 86400
    # Phase 1 单用户管理员凭据，Phase 2 接 DB 用户表（dev 默认值便于本地启动）
    admin:
      username: ${SMT_ADMIN_USERNAME:admin}
      password: ${SMT_ADMIN_PASSWORD:dev-only-admin}
  # OPC UA 采样参数配置化（P0-6），默认值符合 PRD <100ms 契约
  opcua:
    publishing-interval-ms: ${SMT_OPCUA_PUBLISHING_INTERVAL_MS:100}
    sampling-interval-ms: ${SMT_OPCUA_SAMPLING_INTERVAL_MS:50}
    queue-size: ${SMT_OPCUA_QUEUE_SIZE:10}
  # MQTT 数据接入配置（与 docker-compose 中的 mosquitto 对应）
  mqtt:
    broker: ${SMT_MQTT_BROKER:tcp://localhost:1883}
    client-id-prefix: smt-device-
    qos: 1
  # 健康评分规则配置（m8）— 默认值与原 HealthScoreCalculator 硬编码一致
  health:
    score:
      score-maintenance: 30
      score-stopped: 50
      base-score: 100
      score-max: 100
      score-min: 0
      recent-window-minutes: 5
      temp-threshold-low: 80.0
      temp-threshold-high: 100.0
      vib-threshold-low: 10.0
      vib-threshold-high: 20.0
      deduction-high: 40
      deduction-low: 20

  # Mock 数据生成器开关
  mock:
    enabled: false
    interval-ms: 5000
    # 模拟设备与采集点配置，smt.mock.enabled=true 时由 MockMqttPublisher 周期发布
    # 扁平结构：每项含 device-id / datapoint-code / topic，由 MockProperties 绑定
    devices:
      - device-id: 1
        datapoint-code: temperature
        topic: smt/device/1/temperature
      - device-id: 1
        datapoint-code: vibration
        topic: smt/device/1/vibration

  # InfluxDB 时序数据库（P1：device_data 双写，PG 主存 + InfluxDB 时序）
  # 注：org-name 用 kebab-case，Spring relaxed binding 自动映射到 InfluxDBConfig.orgName 字段
  influxdb:
    url: ${SMT_INFLUXDB_URL:http://localhost:8086}
    token: ${SMT_INFLUXDB_TOKEN:dev-only-token}
    org-name: ${SMT_INFLUXDB_ORG:smt}
    bucket: ${SMT_INFLUXDB_BUCKET:device_data}

# 注：logging 段已迁移到 logback-spring.xml 与 application-{profile}.yml（P0-8）
