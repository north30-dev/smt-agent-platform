# SMT 智能运维平台开发环境中间件编排
# 启动: cd docker-compose && docker-compose up -d
# 停止: cd docker-compose && docker-compose down
#
# 包含: PostgreSQL(5432) / Redis(6379) / Zookeeper(2181) / Kafka(9092) / Mosquitto(1883)

version: "3.8"

services:
  # ===== 关系型数据库：PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: smt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smt
      POSTGRES_USER: smt
      POSTGRES_PASSWORD: smt123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - smt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smt -d smt"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 缓存：Redis =====
  redis:
    image: redis:7-alpine
    container_name: smt-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "root", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - smt-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Kafka 依赖：Zookeeper =====
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: smt-zookeeper
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      TZ: Asia/Shanghai
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 消息队列：Kafka =====
  kafka:
    image: bitnami/kafka:3.7
    container_name: smt-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      TZ: Asia/Shanghai
    volumes:
      - smt-kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6

  # ===== MQTT Broker：Eclipse Mosquitto =====
  # 用于 Mock 设备 -> MQTT -> device-service 接收闭环
  # 镜像自带 /mosquitto-no-auth.conf 文件，允许匿名监听 1883，无需挂载自定义 conf
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: smt-mqtt
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "1883:1883"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      # 通过订阅 $SYS 主题验证 broker 已就绪；-W 3 限定 3 秒超时，避免 healthcheck 长时间挂起
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smt-postgres-data:
  smt-redis-data:
  smt-kafka-data:
