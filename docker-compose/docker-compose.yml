# SMT 智能运维平台开发环境中间件编排
# 启动: cd docker-compose && docker-compose up -d
# 停止: cd docker-compose && docker-compose down
#
# 包含: PostgreSQL(5432) / Redis(6379) / Zookeeper(2181) / Kafka(9092) / Mosquitto(1883)
#       Milvus(19530) + etcd(2379) + minio(9000)（Phase 2 新增，供 Python Agent RAG 使用）
#       InfluxDB(8086)（Batch 4 新增，device_data 时序双写）
#
# 网络隔离（M6）：
#   intranet — 内部数据网络（PG/Redis/Kafka/Zookeeper/Milvus/Etcd/MinIO/InfluxDB）
#   edge     — 边缘接入网络（Mosquitto，供设备/Mock 接入）
#   app      — 应用网络（保留给未来微服务接入）
#
# 凭据环境变量化（P0-5）：
#   本文件所有 ${VAR} 引用 docker-compose/.env
#   首次使用：cp docker-compose/.env.example docker-compose/.env
#   然后填入真实值（生产环境必须修改所有占位符）

version: "3.8"

services:
  # ===== 关系型数据库：PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: smt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SMT_DB_NAME:-smt}
      POSTGRES_USER: ${SMT_DB_USERNAME:-smt}
      POSTGRES_PASSWORD: ${SMT_DB_PASSWORD:-smt123}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - smt-postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMT_DB_USERNAME:-smt} -d ${SMT_DB_NAME:-smt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intranet

  # ===== 缓存：Redis =====
  redis:
    image: redis:7-alpine
    container_name: smt-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"${SMT_REDIS_PASSWORD:-root}\" --appendonly yes"]
    ports:
      - "6380:6379"
    volumes:
      - smt-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${SMT_REDIS_PASSWORD:-root}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intranet

  # ===== Kafka 依赖：Zookeeper =====
  zookeeper:
    image: wurstmeister/zookeeper:3.4.6
    container_name: smt-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intranet

  # ===== 消息队列：Kafka =====
  kafka:
    image: wurstmeister/kafka:2.13-2.7.1
    container_name: smt-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CREATE_TOPICS: "smt-device-telemetry:1:1,smt-alarm-events:1:1,device.anomaly:1:1,execution.instruction:1:1,exception.record:1:1"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
    networks:
      - intranet

  # ===== MQTT Broker：Eclipse Mosquitto =====
  # 用于 Mock 设备 -> MQTT -> device-service 接收闭环
  # 镜像自带 /mosquitto-no-auth.conf 文件，允许匿名监听 1883，无需挂载自定义 conf
  # 归属 edge 网络（边缘接入层，供设备/Mock 接入），与内部数据网络隔离
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: smt-mqtt
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "1883:1883"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      # 通过订阅 $SYS 主题验证 broker 已就绪；-W 3 限定 3 秒超时，避免 healthcheck 长时间挂起
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge

  # ===== Phase 2 新增：Milvus 向量库及其依赖 =====
  # 用于 Python Agent RAG（知识助手 + 故障案例库）
  # etcd：Milvus 元数据存储
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: smt-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - TZ=Asia/Shanghai
    volumes:
      - smt-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - intranet

  # minio：Milvus 对象存储
  minio:
    image: minio/minio:RELEASE.2023-03-24T21-41-23Z
    container_name: smt-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${SMT_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${SMT_MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - smt-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - intranet

  # Milvus Standalone：向量数据库
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: smt-milvus
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${SMT_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${SMT_MINIO_SECRET_KEY:-minioadmin}
      MILVUS_AUTHORIZATION_ENABLED: "false"
      TZ: Asia/Shanghai
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - smt-milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    command: ["milvus", "run", "standalone"]
    networks:
      - intranet

  # ===== InfluxDB 2.x：时序数据库（Batch 4 P1 device_data 双写） =====
  # PG 主存 + InfluxDB 时序双写，Java device-service 写入时同步落 InfluxDB
  # 首次启动通过 DOCKER_INFLUXDB_INIT_* 自动初始化 org/bucket/admin token
  influxdb:
    image: influxdb:2.7-alpine
    container_name: smt-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${SMT_INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${SMT_INFLUXDB_ADMIN_PASSWORD:-dev-only-admin}
      DOCKER_INFLUXDB_INIT_ORG: ${SMT_INFLUXDB_ORG:-smt}
      DOCKER_INFLUXDB_INIT_BUCKET: ${SMT_INFLUXDB_BUCKET:-device_data}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${SMT_INFLUXDB_TOKEN:-dev-only-token}
      TZ: Asia/Shanghai
    ports:
      - "8086:8086"
    volumes:
      - smt-influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - intranet

volumes:
  smt-postgres-data:
  smt-redis-data:
  smt-etcd-data:
  smt-minio-data:
  smt-milvus-data:
  smt-influxdb-data:

networks:
  # 内部数据网络：PG/Redis/Kafka/Zookeeper/Milvus/Etcd/MinIO/InfluxDB
  intranet:
    driver: bridge
    name: smt-intranet
  # 边缘接入网络：Mosquitto（设备/Mock 接入），与内部数据网络隔离
  edge:
    driver: bridge
    name: smt-edge
  # 应用网络：保留给未来微服务接入（Phase 3+ Java 微服务扩展）
  app:
    driver: bridge
    name: smt-app
